<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tango Class Management v8 - Supabase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="container" id="appContainer">
    <div id="dynamicView"></div>
</div>

<!-- ========== MODALLAR ========== -->
<!-- Tek girişli dinamik modal -->
<div id="dynamicModal" class="modal">
    <div class="modal-content">
        <h3 id="dynamicModalTitle">Başlık</h3>
        <input type="text" id="dynamicInput" placeholder="" autocomplete="off">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-success" id="dynamicModalConfirm">Tamam</button>
            <button class="btn-secondary" id="dynamicModalCancel">İptal</button>
        </div>
    </div>
</div>

<!-- İki girişli modal (miktar+hafta) - ÖDEMELER için -->
<div id="doubleInputModal" class="modal">
    <div class="modal-content">
        <h3 id="doubleModalTitle">Başlık</h3>
        <input type="text" id="doubleInput1" placeholder="" autocomplete="off">
        <input type="text" id="doubleInput2" placeholder="" autocomplete="off">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-success" id="doubleModalConfirm">Tamam</button>
            <button class="btn-secondary" id="doubleModalCancel">İptal</button>
        </div>
    </div>
</div>

<!-- Onay modalı (silme) -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>Emin misiniz?</h3>
        <p id="confirmMessage">Bu işlem geri alınamaz.</p>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-danger" id="confirmModalYes">Evet, sil</button>
            <button class="btn-secondary" id="confirmModalNo">İptal</button>
        </div>
    </div>
</div>

<!-- Öğrenci düzenleme/silme modalı (çift modlu) -->
<div id="studentActionModal" class="modal">
    <div class="modal-content">
        <!-- Görüntüleme modu -->
        <div id="studentViewMode">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="studentNameDisplay" style="font-size:18px; font-weight:600;"></span>
                <div style="display:flex; gap:12px;">
                    <span id="studentEditBtn" style="cursor:pointer; color:var(--primary);"><i data-lucide="pencil" size="22"></i></span>
                    <span id="studentDeleteBtn" style="cursor:pointer; color:var(--danger);"><i data-lucide="trash-2" size="22"></i></span>
                </div>
            </div>
            <button class="btn-secondary" id="studentModalCloseView" style="width:100%; margin-top:25px;">Kapat</button>
        </div>

        <!-- Düzenleme modu (başlangıçta gizli) -->
        <div id="studentEditMode" style="display:none;">
            <h3 style="margin-top:0;">Öğrenci Adını Düzenle</h3>
            <input type="text" id="studentEditInput" style="width:100%; margin:15px 0;" autocomplete="off">
            <div style="display:flex; gap:10px;">
                <button class="btn-success" id="studentSaveBtn">Kaydet</button>
                <button class="btn-secondary" id="studentCancelEditBtn">İptal</button>
            </div>
        </div>
    </div>
</div>

<!-- Sınıf düzenleme modalı (ad + yeni başlangıç tarihi) -->
<div id="editClassModal" class="modal">
    <div class="modal-content">
        <h3>Sınıf Düzenle</h3>
        <input type="text" id="editClassNameInput" placeholder="Sınıf adı" autocomplete="off" style="width:100%; margin-bottom:12px;">
        <input type="date" id="editClassNewDateInput" placeholder="Yeni başlangıç tarihi (opsiyonel)" autocomplete="off" style="width:100%; margin-bottom:12px;">
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">Yeni tarih girerseniz, bu tarih mevcut ders listesine eklenir ve sonraki haftalar bu tarihe göre eklenir.</p>
        <div style="display:flex; gap:10px;">
            <button class="btn-success" id="editClassSaveBtn">Kaydet</button>
            <button class="btn-secondary" id="editClassCancelBtn">İptal</button>
        </div>
    </div>
</div>

<!-- Video Modal: Başlık ortada, link neon, iki ikon (play, trash), altında geniş Kapat butonu -->
<div id="videoModal" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <h3 style="margin-top:0; text-align: center;">
            <i data-lucide="video" size="20" style="color:var(--neon-green); display: inline-block; vertical-align: middle;"></i> 
            <span style="vertical-align: middle;">Lesson Recap</span>
        </h3>
        <p id="videoLinkDisplay" style="word-break:break-all; background:rgba(45,212,191,0.1); padding:12px; border-radius:8px; font-size:13px; margin:20px 0; color: var(--neon-green); border: 1px solid rgba(45,212,191,0.3);"></p>
        <div style="display:flex; gap:24px; justify-content: center; margin:15px 0 20px 0;">
            <span id="watchVideoBtn" style="cursor:pointer; color: var(--neon-green); transition: transform 0.2s;">
                <i data-lucide="play" size="32"></i>
            </span>
            <span id="deleteVideoBtn" style="cursor:pointer; color: var(--danger); transition: transform 0.2s;">
                <i data-lucide="trash-2" size="32"></i>
            </span>
        </div>
        <button id="closeVideoModalBtn" class="btn-secondary" style="width:100%;">Kapat</button>
    </div>
</div>

</body>
</html>
